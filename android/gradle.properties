org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Sized for an 8 GB development machine. The Flutter template ships
# -Xmx8G -XX:MaxMetaspaceSize=4G, which asks for more memory than an 8 GB
# machine has; once the separate Kotlin daemon starts, Linux/Windows starts
# swapping and both compilers die with "heap space" / "out of memory".
# Raise these only on a machine with 16 GB or more.
kotlin.daemon.jvmargs=-Xmx1G
# One Gradle worker keeps peak simultaneous JVM count down; the Kotlin daemon,
# the Gradle daemon and the Dart frontend server must all fit in RAM together.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
